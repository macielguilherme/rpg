<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caçador Solitário — Capítulo 1: Vale do Amanhecer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #040406;
            color: #ffffff;
            font-family: 'Pixelify Sans', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-viewport {
            position: relative;
            width: 1024px;
            height: 576px;
            border: 3px solid var(--accent-blood-hot, #E65B5B);
            box-shadow: 0 0 35px rgba(230, 91, 91, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.8);
            background: #000;
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        /* OVERLAY DA INTERFACE (HUD) */
        .game-ui-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(8, 8, 12, 0.85);
            border: 1px solid rgba(230, 91, 91, 0.5);
            padding: 8px 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .ui-region-tag {
            font-size: 11px;
            color: var(--accent-gold, #ebb432);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 5px rgba(235, 180, 50, 0.4);
        }

        .controls-hint {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(8, 8, 12, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            font-size: 11px;
            color: #ccc;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .controls-key {
            color: var(--accent-blood-hot, #E65B5B);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="game-viewport">
        <canvas id="gameCanvas" width="1024" height="576"></canvas>

        <div class="game-ui-overlay">
            <span class="ui-region-tag">capítulo 1 — vale do amanhecer</span>
        </div>

        <div class="controls-hint">
            <span class="controls-key">[A] / [D]</span> Mover | <span class="controls-key">[W] / [Espaço]</span> Pular
        </div>
    </div>

    <script src="js/jogar.js"></script>
</body>

</html>
