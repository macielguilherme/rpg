<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caçador Solitário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body class="pagina-home">

    <!-- Vídeo de fundo -->
    <video class="home-bg-video" autoplay muted playsinline loop>
        <source src="assets/images/backgrounds/fundo.mp4" type="video/mp4">
    </video>
    <div class="home-bg-overlay"></div>

    <!-- Tela de título -->
    <main class="title-screen">
        <div class="title-panel">

            <h1 class="title-logo">
                <span class="title-logo-main">CAÇADOR</span>
                <span class="title-logo-sub">SOLITÁRIO</span>
            </h1>

            <div class="title-ornament" aria-hidden="true">✦</div>

            <nav class="title-menu" aria-label="Menu principal">

                <button class="title-menu-item" data-action="entrar" type="button">
                    <span class="menu-cursor">▶</span>
                    <span class="menu-label">ENTRAR</span>
                </button>

                <a href="criar.html" class="title-menu-item">
                    <span class="menu-cursor">▶</span>
                    <span class="menu-label">NOVA FICHA</span>
                </a>

                <a href="ficha.html" class="title-menu-item">
                    <span class="menu-cursor">▶</span>
                    <span class="menu-label">CONTINUAR</span>
                </a>

                <a href="jogar.html" class="title-menu-item">
                    <span class="menu-cursor">▶</span>
                    <span class="menu-label">JOGAR</span>
                </a>

                <a href="personagens.html" class="title-menu-item">
                    <span class="menu-cursor">▶</span>
                    <span class="menu-label">BESTIÁRIO</span>
                </a>

                <a href="historia.html" class="title-menu-item">
                    <span class="menu-cursor">▶</span>
                    <span class="menu-label">CRÔNICA</span>
                </a>

                <a href="mapa.html" class="title-menu-item">
                    <span class="menu-cursor">▶</span>
                    <span class="menu-label">MAPA</span>
                </a>

            </nav>

            <div class="title-footer">
                <span>v1.0.0</span>
                <span>© 2026</span>
            </div>

        </div>
    </main>

    <!-- Modal de login -->
    <div class="login-overlay" id="loginOverlay" aria-hidden="true">
        <div class="login-modal" role="dialog" aria-modal="true">

            <button class="login-close" id="loginClose" aria-label="Fechar" type="button">✕</button>

            <h2 class="login-title">Entrar</h2>
            <p class="login-subtitle">A jornada começa</p>

            <form class="login-form" id="loginForm">

                <div class="form-group">
                    <label class="form-label" for="email">Nome do Caçador</label>
                    <input type="text" id="email" name="email" class="form-input" placeholder="cacador@kagetsumi.jp"
                        autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-input" placeholder="••••••••"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg">Entrar</button>

            </form>

            <div class="login-links">
                <a href="#">Esqueci minha senha</a>
            </div>

        </div>
    </div>

    <script src="js/global.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
